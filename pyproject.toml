[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "web-scanner"
version = "0.1.0"
description = "Authorized web vulnerability scanner and reporting CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=1.10",
  "httpx>=0.24,<0.28",
  "beautifulsoup4>=4.12",
  "Jinja2>=3.1",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
pdf = ["weasyprint>=60.0"]

[project.scripts]
web-scanner = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*", "scanner*", "integrations*", "reporting*"]

[tool.setuptools.package-data]
reporting = ["templates/*.html"]
